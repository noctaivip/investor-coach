name = "investor-coach-ai"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
COACH_MODEL = "gpt-5.6-terra"
TRANSCRIBE_MODEL = "gpt-4o-transcribe"

# Create once: npx wrangler d1 create investor-coach-production
# Then replace database_id below with the returned ID.
[[d1_databases]]
binding = "DB"
database_name = "investor-coach-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
